<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Segurança (CSP): só carrega recursos do próprio app e bloqueia acesso à rede na interface -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Academia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Área onde as telas (login, menu e páginas) são desenhadas -->
  <div id="raiz"></div>
  <!-- Área das mensagens rápidas (toasts) -->
  <div id="avisos" role="status" aria-live="polite"></div>
  <!-- Código da interface (gerado a partir de app.ts) -->
  <script src="app.js"></script>
</body>
</html>
